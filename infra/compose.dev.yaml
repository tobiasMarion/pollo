name: pollo-dev

# Dev environment: datastores only.
# The API runs on the host with hot-reload (`just dev`) — faster feedback and
# simpler than containerizing it. Full-docker comes with the prod compose.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pollo
      POSTGRES_PASSWORD: pollo
      POSTGRES_DB: pollo
    ports:
      - '5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pollo -d pollo']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg_data:
  redis_data:
