name: pollo

# Production stack for a single VPS (ADR 0001). Secrets come from the root
# .env via --env-file — see the `prod-*` targets in the justfile.
# Postgres and Redis are intentionally not published to the host.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pollo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: pollo
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pollo -d pollo']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    command:
      [
        'sh',
        '-c',
        'npx prisma migrate deploy --config apps/backend/prisma.config.ts && node apps/backend/dist/server.js',
      ]
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3333
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://pollo:${POSTGRES_PASSWORD:?}@postgres:5432/pollo?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:?}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:?}
      GITHUB_OAUTH_CLIENT_REDIRECT_URI: ${GITHUB_OAUTH_CLIENT_REDIRECT_URI:?}
    ports:
      - '3333:3333'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3333/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      # adapter-node checks the Origin of form posts against this, so it must
      # be the address the operator actually types.
      ORIGIN: ${WEB_ORIGIN:?set WEB_ORIGIN in .env}
      # Public: also used by the browser for the admin WebSocket.
      PUBLIC_POLLO_API_URL: ${PUBLIC_POLLO_API_URL:?set PUBLIC_POLLO_API_URL in .env}
      # Private: inside the compose network the public host does not resolve.
      POLLO_API_INTERNAL_URL: http://api:3333
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:?}
      GITHUB_OAUTH_CLIENT_REDIRECT_URI: ${GITHUB_OAUTH_CLIENT_REDIRECT_URI:?}
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
