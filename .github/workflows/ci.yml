name: CI

# pull_request tests the merge preview; the ruleset requires branches to be up
# to date with main, so what lands after merge is exactly what was tested —
# no need to re-run on push to main.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://pollo:pollo@localhost:5432/pollo?schema=public
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pollo
          POSTGRES_PASSWORD: pollo
          POSTGRES_DB: pollo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pollo -d pollo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint and format (Biome)
        run: npm run ci

      # Both apps import the built package, so nothing after this can run
      # without it — typecheck included.
      - name: Build the shared contracts
        run: npm run contracts

      - name: Generate Prisma client
        run: npm run db:generate -w @pollo/backend

      - name: Typecheck
        run: npm run typecheck

      - name: Build the admin panel
        run: npm run build -w @pollo/web

      - name: Migrations apply cleanly
        run: npm run db:migrate -w @pollo/backend

      # Every workspace's own suite, through the root script: `--if-present`
      # means a new package is covered the day it grows tests, not the day
      # someone remembers to add a line here.
      - name: Unit and contract tests
        run: npm test

      - name: Integration tests
        run: npm run test:integration -w @pollo/backend

      - name: E2E tests
        run: npm run test:e2e -w @pollo/backend

  docker:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-password
      JWT_SECRET: ci-secret-0123456789abcdef
      GITHUB_OAUTH_CLIENT_ID: ci-client-id
      GITHUB_OAUTH_CLIENT_SECRET: ci-client-secret
      GITHUB_OAUTH_CLIENT_REDIRECT_URI: http://localhost:3000/api/auth/callback
      PUBLIC_POLLO_API_URL: http://localhost:3333
      WEB_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v7

      - name: Build production images
        run: docker compose -f infra/compose.prod.yaml build

      - name: Boot the stack and check health
        run: |
          docker compose -f infra/compose.prod.yaml up -d --wait
          curl -sf http://localhost:3333/health
          curl -sf http://localhost:3000/health

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f infra/compose.prod.yaml logs

      - name: Teardown
        if: always()
        run: docker compose -f infra/compose.prod.yaml down -v
